# Secret is supplied by SEARXNG_SECRET, which overrides server.secret_key.
use_default_settings:
  engines:
    keep_only: [google, bing, duckduckgo, brave, startpage, mojeek]
server:
  limiter: false
  public_instance: false
  image_proxy: false
search:
  formats: [html, json]
outgoing:
  request_timeout: 8
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
